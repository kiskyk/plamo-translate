<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>PDF 分割の点検</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Splits every page of each test PDF into blocks and lists what looks wrong.
import * as lib from "../vendor/pdfjs/pdf.min.mjs";
import { blocksFromPage, graphicsBoxes } from "../pdftext.js";
lib.GlobalWorkerOptions.workerSrc = "../vendor/pdfjs/pdf.worker.min.mjs";

const files = new URLSearchParams(location.search).get("files").split(",");
const report = {};
for (const f of files) {
  const pdf = await lib.getDocument("papers/" + f).promise;
  const r = { pages: pdf.numPages, fonts: {}, kinds: {}, tables: [], figures: 0, suspicious: [] };
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 1 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp, intent: "print" }).promise;
    const tc = await page.getTextContent();
    for (const it of tc.items) {
      if (!it.str?.trim()) continue;
      let name = "?";
      try { name = page.commonObjs.get(it.fontName).name.replace(/^[A-Z]{6}\+/, ""); } catch {}
      r.fonts[name] = (r.fonts[name] || 0) + it.str.length;
    }
    const gfx = graphicsBoxes(await page.getOperatorList({ intent: "print" }), lib.OPS);
    const blocks = blocksFromPage(page, tc, gfx);
    for (const b of blocks) {
      r.kinds[b.kind] = (r.kinds[b.kind] || 0) + 1;
      if (b.kind === "table") r.tables.push(`p${n} ${b.rows.length}x${b.rows[0].length}${b.regular ? "" : " IMG"}: ` + b.rows[0].map((c) => (c ? c.text : "·")).join(" | ").slice(0, 90));
      if (b.kind === "figure") { r.figures++; (r.figPages ||= []).push(n); }
      if (b.kind !== "text") continue;
      const t = b.text;
      const letters = (t.match(/[A-Za-z]/g) || []).length;
      const words = t.split(/\s+/).length;
      if (t.length > 2500) r.suspicious.push(`p${n} LONG ${t.length}: ${t.slice(0, 80)}`);
      else if (t.length > 20 && letters / t.length < 0.45) r.suspicious.push(`p${n} SYMBOLS: ${t.slice(0, 80)}`);
      else if (words >= 6 && t.split(/\s+/).filter((w) => w.length <= 2).length / words > 0.6) r.suspicious.push(`p${n} FRAGMENTS: ${t.slice(0, 80)}`);
    }
    // many 1-3 word text blocks on one page = labels of a chart read as paragraphs
    const tiny = blocks.filter((b) => b.kind === "text" && b.text.split(/\s+/).length <= 3 && !/^\d+$/.test(b.text)).length;
    if (tiny >= 8) r.suspicious.push(`p${n} MANY-TINY ${tiny}: ` + blocks.filter((b) => b.kind === "text" && b.text.split(/\s+/).length <= 3).slice(0, 8).map((b) => b.text).join(" / "));
  }
  r.fonts = Object.entries(r.fonts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `${k}:${v}`).join(", ");
  report[f] = r;
}
window.__report = report;
document.getElementById("out").textContent = JSON.stringify(report, null, 1);
</script>
</body>
</html>
